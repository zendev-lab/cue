[workspace]
release_always = false
publish = true
git_only = false
dependencies_update = false
custom_minor_increment_regex = "^breaking$|^💥 breaking:"
changelog_update = false
git_release_enable = false
git_tag_name = "{{ package }}-v{{ version }}"
pr_name = "🔖 release: publish Cue{% if version %} {{ version }}{% endif %}"
pr_body = """## 动机

发布下一版 Cue，统一 Rust、Python 和 npm 版本。

## 解决方案

{% for release in releases %}
- `{{ release.package }}`: {{ release.previous_version }} → {{ release.next_version }}
{% if release.breaking_changes %}
{{ release.breaking_changes }}
{% endif %}
{% endfor %}

合并后由 release-plz 发布 Rust crates，再触发 PyPI/npm 发布。
"""

[[package]]
name = "cue-cli"
version_group = "cue"

[[package]]
name = "cue-client"
version_group = "cue"

[[package]]
name = "cue-core"
version_group = "cue"

[[package]]
name = "cue-daemon"
version_group = "cue"

[[package]]
name = "cue-language"
version_group = "cue"

[[package]]
name = "cue-protocol"
version_group = "cue"

[[package]]
name = "cue-runtime"
version_group = "cue"

[[package]]
name = "cue-store-sqlite"
version_group = "cue"

[[package]]
name = "cue-tui"
version_group = "cue"
