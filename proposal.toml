version = 1

[proposal]
prefix = "FP"
number_field = "fp"
documents_dir = "fps"
schema = "schemas/fp.schema.json"
index = "fps-index.json"
metadata_title = "plain"

[templates]
Feature = "templates/fp.md"
Governance = "templates/fp.md"

[graph]
# Cue records relations without an Accepted/Superseded lifecycle.
fields = ["supersedes"]

[defines]
field = "defines"
anchor_prefix = "term-"
id_pattern = "[a-z][a-z0-9]*(?:-[a-z0-9]+)*"

[index]
version = 2
entries_key = "fps"
fields = [
  "fp",
  { name = "path", source = "path" },
  "title",
  "type",
  "authors",
  "created",
  "supersedes",
  { name = "superseded_by", source = "inverse", key = "supersedes" },
]
