[workspace]
resolver = "2"
members = [
  "crates/cue-cli",
  "crates/cue-client",
  "crates/cue-core",
  "crates/cue-daemon",
  "crates/cue-language",
  "crates/cue-protocol",
  "crates/cue-runtime",
  "crates/cue-store-sqlite",
  "crates/cue-tui",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/zendev-lab/cue"
license = "MIT"

[workspace.dependencies]
cue-cli = { path = "crates/cue-cli", version = "0.2.0" }
cue-client = { path = "crates/cue-client", version = "0.2.0" }
cue-core = { path = "crates/cue-core", version = "0.2.0" }
cue-daemon = { path = "crates/cue-daemon", version = "0.2.0" }
cue-language = { path = "crates/cue-language", version = "0.2.0" }
cue-protocol = { path = "crates/cue-protocol", version = "0.2.0" }
cue-runtime = { path = "crates/cue-runtime", version = "0.2.0" }
cue-store-sqlite = { path = "crates/cue-store-sqlite", version = "0.2.0" }
cue-tui = { path = "crates/cue-tui", version = "0.2.0" }

# Error handling
anyhow = "1"
base64 = "0.23"
# Hashing
blake3 = "1"
crossterm = { version = "0.29", features = ["bracketed-paste", "events"] }
# Snapshot tests
insta = { version = "1", features = ["json"] }
libc = "0.2"
# TUI
ratatui = "0.30"
# Storage
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Async runtime
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time"
] }
toml = "1.1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 1
