name: CE - Quality
on:
  schedule:
    - cron: 47 3 * * 1
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-quality:
    name: Rust Dependency and API Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-machete@0.9.2,cargo-deny@0.20.2,cargo-semver-checks@0.51.0
          fallback: none
      - run: |
          cargo machete
          cargo deny check advisories
          cargo deny --manifest-path fuzz/Cargo.toml check advisories
        shell: bash
      - name: Check public crate compatibility
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: cargo semver-checks --workspace --baseline-rev "$BASE_REV"
      - name: Inventory licenses without imposing a new policy
        run: |
          mkdir -p reports
          cargo deny list --format json > reports/rust-licenses.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: rust-licenses
          path: reports/rust-licenses.json
          if-no-files-found: error

  vulnerabilities:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --lockfile=fuzz/Cargo.lock

  hygiene:
    name: Structure and External Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - run: |
          mkdir -p reports
          npx --yes jscpd@5.4.2 --reporters json --output reports/jscpd --ignore '**/target/**,**/tests/**' crates scripts
          uvx lizard==1.24.3 --ignore_warnings -1 --xml crates > reports/complexity.xml
        shell: bash
      - run: |
          set -euo pipefail
          mkdir -p reports
          git ls-files -z '*.md' ':(exclude).agents/notes/**' | xargs -0 uvx --from lychee-bin==0.24.2 lychee --scheme https --scheme http --timeout 20 --max-retries 1 --no-progress --format json --output reports/links.json
        if: ${{ !cancelled() }}
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: hygiene-reports
          path: reports
          if-no-files-found: error

  workflow-audit:
    name: Online Workflow Audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Audit action provenance and references
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --with shellcheck-py==0.11.0.1 --with pyflakes==3.4.0 jactionlint==2.3.0 --online=strict
          --online-report=workflow-audit.json --shellcheck=shellcheck --pyflakes=pyflakes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: workflow-audit
          path: workflow-audit.json
          if-no-files-found: error
  benchmarks:
    name: Protocol Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"
      - run: cargo install cargo-codspeed --version 6.0.0 --locked
      - run: cargo codspeed build -p cue-protocol --locked
      - uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: cargo codspeed run

  sonar:
    name: Sonar Rust Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"
          components: clippy, llvm-tools
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.6.21
          fallback: none
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Analyze Rust and helper sources
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  model-check:
    name: Concurrent Output Model
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"
      - run: |
          RUSTFLAGS='--cfg cue_loom' CARGO_TARGET_DIR=target/loom cargo test -p cue-runtime --lib output::loom_tests --locked


        shell: bash
  robustness:
    name: Mutation Fuzz and Miri
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-mutants@27.1.0,cargo-fuzz@0.13.2
          fallback: none
      - run: rustup toolchain install nightly-2026-10-26 --profile minimal --component miri
      - run: |
          set -euo pipefail
          mkdir -p reports/mutation
          status=0
          # Mutated storage panics can strand PTY tasks; process tests run in the native suite.
          cargo mutants --package cue-core --package cue-protocol --package cue-runtime --file crates/cue-core/src/kernel/env.rs --file crates/cue-protocol/src/framing.rs --file crates/cue-runtime/src/output.rs --jobs 2 --cargo-arg=--locked --output reports/mutation -- --lib -- --skip runner::tests || status=$?
          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
              exit "$status"
          fi
        shell: bash
      - run: |
          cargo +nightly-2026-10-26 fetch --manifest-path fuzz/Cargo.toml --locked
          mkdir -p fuzz/corpus/boundaries
          CARGO_NET_OFFLINE=true cargo +nightly-2026-10-26 fuzz run boundaries fuzz/corpus/boundaries fuzz/seeds/boundaries -- -max_total_time=60 -max_len=4096
        if: ${{ !cancelled() }}
        shell: bash
      - run: |
          MIRIFLAGS='-Zmiri-env-set=PROPTEST_CASES=8 -Zmiri-env-set=PROPTEST_RNG_SEED=1 -Zmiri-env-set=PROPTEST_DISABLE_FAILURE_PERSISTENCE=1' cargo +nightly-2026-10-26 miri test -p cue-core -p cue-protocol --lib --locked -- --skip encoder_accepts_limit_and_rejects_one_byte_more
        if: ${{ !cancelled() }}
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: robustness-reports
          path: |
            reports/mutation
            fuzz/corpus
            fuzz/artifacts
          if-no-files-found: error
