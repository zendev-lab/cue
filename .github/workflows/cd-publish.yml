name: "CD - Publish"

on:
  push:
    tags:
      - "v*"

concurrency:
  group: cd-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  check-version:
    name: Check release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag against Cargo workspace version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo metadata --no-deps --locked --format-version 1 |
            jq -e --arg tag "$RELEASE_TAG" \
              '.packages | length > 0 and all(.[]; "v" + .version == $tag)'

  build-packages:
    name: Build packages
    needs: check-version
    uses: ./.github/workflows/build-packages.yml

  publish-pypi:
    name: Publish PyPI
    environment: pypi-release
    runs-on: ubuntu-latest
    needs:
      - build-packages
    permissions:
      contents: read
      # PyPI trusted publishing exchanges GitHub's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cue-run-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  publish-npm:
    name: Publish npm
    runs-on: ubuntu-latest
    needs:
      - build-packages
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cue-npm
          path: dist
      - name: Publish npm artifact
        run: npm publish dist/*.tgz --access public

  publish-crates:
    name: Publish crates.io
    needs: build-packages
    runs-on: ubuntu-latest
    environment: crates-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.1"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
      - name: Publish workspace crates
        run: |
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          # Publish the entire version group; skip only versions already uploaded.
          packages=()
          while read -r name version; do
            status="$(curl --silent --show-error --retry 3 --output /tmp/crate-version.json --write-out '%{http_code}' \
              --user-agent 'cue-release (zendev-lab/cue)' "https://crates.io/api/v1/crates/$name/$version")"
            case "$status" in
              200) jq -e --arg name "$name" --arg version "$version" \
                     '.version | .crate == $name and .num == $version and .yanked == false' /tmp/crate-version.json ;;
              404) packages+=(-p "$name") ;;
              *) echo "crates.io lookup failed for $name@$version (HTTP $status)" >&2; exit 1 ;;
            esac
          done <<< "$(jq -r '.packages[] | [.name, .version] | @tsv' <<< "$metadata")"
          if ((${#packages[@]})); then
            cargo publish --locked --registry crates-io "${packages[@]}"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - publish-pypi
      - publish-npm
      - publish-crates
    permissions:
      # The release job creates a GitHub Release and uploads its artifacts.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cue-*
          path: dist
          merge-multiple: true
      - name: Select upgrade notes
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if test -f "$notes"; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.path }}
          overwrite_files: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.tgz
