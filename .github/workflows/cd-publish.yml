name: "CD - Publish"

on:
  push:
    tags:
      - "v*"

concurrency:
  group: cd-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  build-wheel:
    name: wheel (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            artifact: wheel-linux-x86_64
          - label: macos-x86_64
            runner: macos-15-intel
            artifact: wheel-macos-x86_64
          - label: macos-arm64
            runner: macos-15
            artifact: wheel-macos-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - name: Prepare pinned Ghostty toolchain
        if: runner.os != 'Linux'
        shell: bash
        run: |
          source scripts/prepare-ghostty.sh
          dirname "$(command -v zig)" >> "$GITHUB_PATH"
          printf 'GHOSTTY_SOURCE_DIR=%s\n' "$GHOSTTY_SOURCE_DIR" >> "$GITHUB_ENV"
          printf 'GHOSTTY_ZIG_SYSTEM_DIR=%s\n' "$GHOSTTY_ZIG_SYSTEM_DIR" >> "$GITHUB_ENV"
          if [[ -n "${CUE_ZIG_MACOS_SDK:-}" ]]; then
            printf 'CUE_ZIG_MACOS_SDK=%s\n' "$CUE_ZIG_MACOS_SDK" >> "$GITHUB_ENV"
            printf 'SDKROOT=%s\n' "$SDKROOT" >> "$GITHUB_ENV"
            dirname "$(command -v xcrun)" >> "$GITHUB_PATH"
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-wheel-${{ matrix.label }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.13.3
          rust-toolchain: "1.95"
          command: build
          manylinux: "2014"
          before-script-linux: source scripts/prepare-ghostty.sh
          args: --release --locked --compatibility pypi --out dist

      - name: Verify wheel binary contract
        shell: bash
        run: scripts/verify-wheel.sh dist/*.whl "${{ matrix.label }}"

      - name: Smoke-test built wheel
        shell: bash
        run: |
          repo_root="$PWD"
          wheel_path="$repo_root/dist/$(basename dist/*.whl)"
          uv tool run --from "$wheel_path" cue --version
          uv tool run --from "$wheel_path" cue --help
          uv tool run --from "$wheel_path" cue-client --version
          uv tool run --from "$wheel_path" cue-client target resolve --json
          uv tool run --from "$wheel_path" cue-client target list --json
          uv tool run --from "$wheel_path" cue-tui --version
          uv tool run --from "$wheel_path" cue-daemon --version
          uv tool run --from "$wheel_path" cued --version
          uv tool run --from "$wheel_path" cue client target resolve --json
          uv tool run --from "$wheel_path" cue daemon --version
          if uv tool run --from "$wheel_path" cue target resolve --json; then
            echo "cue target unexpectedly succeeded" >&2
            exit 1
          fi
          uv tool run --from "$wheel_path" cued status

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cue-shell-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs:
      - build-wheel
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: cue-shell-*
          path: dist
          merge-multiple: true
      - name: List release artifacts
        run: ls -1 dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: github-release
    runs-on: ubuntu-latest
    needs:
      - build-wheel
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: cue-shell-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.whl
