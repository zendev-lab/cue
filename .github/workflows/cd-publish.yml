name: "CD - Publish"

on:
  push:
    tags:
      - "v*"

concurrency:
  group: cd-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  check-version:
    name: Check release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag against Cargo workspace version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo metadata --no-deps --locked --format-version 1 |
            jq -e --arg tag "$RELEASE_TAG" \
              '.packages | length > 0 and all(.[]; "v" + .version == $tag)'

  check-crates:
    needs: check-version
    name: Crate package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
      - name: Verify unpublished workspace packages
        run: cargo package --workspace --registry crates-io --locked

  build-skill:
    needs: check-version
    name: Build npm Skill package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Pack and smoke-test Skill artifact
        run: npm run pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cue-npm
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  build-wheel:
    needs: check-version
    name: wheel (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
          - label: macos-x86_64
            runner: macos-15-intel
          - label: macos-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          rust-toolchain: "1.95"
          command: build
          manylinux: "2014"
          args: --release --locked --compatibility pypi --out dist

      - name: Smoke-test built wheel
        run: ./scripts/smoke_package.sh dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cue-run-wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  build-sdist:
    needs: check-version
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          rust-toolchain: "1.95"
          command: sdist
          args: --out dist

      - name: Smoke-test source distribution
        run: ./scripts/smoke_package.sh dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cue-run-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish PyPI
    environment: pypi-release
    runs-on: ubuntu-latest
    needs:
      - check-crates
      - build-wheel
      - build-sdist
      - build-skill
    permissions:
      contents: read
      # PyPI trusted publishing exchanges GitHub's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cue-run-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true

  publish-npm:
    name: Publish npm
    runs-on: ubuntu-latest
    needs:
      - check-crates
      - build-wheel
      - build-sdist
      - build-skill
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cue-npm
          path: dist
      - name: Publish npm artifact
        run: npm publish ./dist/*.tgz --access public

  publish-crates:
    name: Publish crates.io
    needs: [check-crates, build-wheel, build-sdist, build-skill]
    runs-on: ubuntu-latest
    environment: crates-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
      - name: Publish unpublished workspace crates
        uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b # v2
        with:
          args: --locked
          registry-token: ${{ steps.auth.outputs.token }}

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # A GitHub Release contains the tag's checked and built artifacts. It does
    # not need every registry publisher to succeed; each registry can be
    # retried independently without withholding the release record.
    needs:
      - check-version
      - check-crates
      - build-wheel
      - build-sdist
      - build-skill
    permissions:
      # The release job creates a GitHub Release and uploads its artifacts.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cue-*
          path: dist
          merge-multiple: true
      - name: Select upgrade notes
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if test -f "$notes"; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.path }}
          overwrite_files: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.tgz
