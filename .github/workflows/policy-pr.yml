name: Policy - PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: policy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-message:
    name: PR message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check PR title
        uses: zendev-lab/zendev/actions/validate-title@66d020624b6d3e318c3e5c26acab29458998b74d # v0.6.0
        with:
          text: ${{ github.event.pull_request.title }}
          profile: zendev

      - name: Check PR body
        if: >-
          github.event.pull_request.user.login != 'renovate[bot]' &&
          github.event.pull_request.user.login != 'zendev-release[bot]'
        uses: zendev-lab/zendev/actions/validate-body@66d020624b6d3e318c3e5c26acab29458998b74d # v0.6.0
        with:
          body: ${{ github.event.pull_request.body }}

      - name: Skip PR body check for release and dependency bots
        if: >-
          (github.event.pull_request.user.login == 'renovate[bot]' ||
           github.event.pull_request.user.login == 'zendev-release[bot]')
        run: echo "Release and dependency bot PR bodies are exempt from the repository description template."
