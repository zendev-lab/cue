name: Policy - PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: policy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-message:
    name: PR message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check PR title
        if: >-
          github.event.pull_request.user.login != 'renovate[bot]' &&
          github.event.pull_request.user.login != 'zendev-cue-release[bot]'
        uses: zendev-lab/zendev/actions/validate-title@91087d4d4e9841aaf8cead8b7c6d294a3db63b10 # v0.4.0
        with:
          text: ${{ github.event.pull_request.title }}
          profile: zendev

      - name: Check PR body
        if: >-
          github.event.pull_request.user.login != 'renovate[bot]' &&
          github.event.pull_request.user.login != 'zendev-cue-release[bot]'
        uses: zendev-lab/zendev/actions/validate-body@91087d4d4e9841aaf8cead8b7c6d294a3db63b10 # v0.4.0
        with:
          body: ${{ github.event.pull_request.body }}

      - name: Skip PR message checks for release and dependency bots
        if: >-
          (github.event.pull_request.user.login == 'renovate[bot]' ||
           github.event.pull_request.user.login == 'zendev-cue-release[bot]')
        run: echo "Release and dependency bot PRs are exempt from the repository title and description conventions."
