name: "CD - Release"

on:
  push:
    branches: [main]

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Both jobs observe pushes to main. release_always = false lets release-plz
# identify a merged release PR through GitHub's associated-PR API.
jobs:
  create-tags:
    timeout-minutes: 10
    name: Tag the merged release PR
    if: github.repository == 'zendev-lab/cue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
      - name: Create tags (git_only mode; no registry publishing)
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5
        with:
          command: release
          version: "0.3.162"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  release-pr:
    timeout-minutes: 20
    name: Prepare the next release PR
    if: github.repository == 'zendev-lab/cue'
    # The release command pushes the vX.Y.Z tags for a merged release PR.
    # Wait for those tags before calculating the next release, otherwise a
    # concurrent release-pr run can treat the just-merged release commit as
    # unreleased work and open a redundant PR.
    needs: create-tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
      - name: Create or update the release PR
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5
        with:
          command: release-pr
          version: "0.3.162"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
