name: "CD - Release"

on:
  push:
    branches: [main]

permissions:
  contents: read

# Both jobs observe pushes to main. release_always = false lets release-plz
# identify a merged release PR through GitHub's associated-PR API.
jobs:
  create-tags:
    name: Tag the merged release PR
    if: github.repository == 'zendev-lab/cue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.1"
      - name: Create tags (git_only mode; no registry publishing)
        uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5
        with:
          command: release
          version: "0.3.162"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  release-pr:
    name: Prepare the next release PR
    if: github.repository == 'zendev-lab/cue'
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.1"
      - name: Create or update the release PR
        uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5
        with:
          command: release-pr
          version: "0.3.162"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
